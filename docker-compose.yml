# MySQL para desarrollo local. El back y el front se corren fuera de Docker.
# Usa el 3307 de la compu para no chocar con un MySQL instalado (que suele usar el 3306).
# Levantar: docker compose up -d   |   Bajar: docker compose down
# Borrar también los datos: docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: chitgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-chitgo}
      MYSQL_USER: ${DB_USER:-chitgo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chitgo}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - chitgo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chitgo-mysql-data:
