# Perfil script: corre un comando del script del local (HU-16) y termina. Lo usa ComandosDelLocal y no se
# combina con dev. Cómo se corre está en el README, en "Alta de un local".
spring:
  main:
    banner-mode: off
  # Flyway migra como al arrancar el back, así el script anda sobre una base recién creada. Solo con
  # db/migration: no carga ninguna semilla. Para que no falle al validar contra una base que tiene una
  # semilla aplicada, ignora las migraciones aplicadas que no están en las locations: la R__ de dev
  # (missing) y la V100 de la demo (future). El valor reemplaza al default (*:future), por eso va también.
  flyway:
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing,*:future"

# El back necesita levantar como app web (SecurityConfig pide HttpSecurity), así que el servidor arranca
# unos segundos, solo en 127.0.0.1 (la compu, o el contenedor con Docker) y en un puerto libre, para no
# chocar con el back si está corriendo.
server:
  address: 127.0.0.1
  port: 0

logging:
  level:
    root: WARN

chitgo:
  push:
    habilitado: false
  auditoria:
    retencion-habilitada: false
  alertas:
    demora:
      habilitada: false
    mesa-sin-mozo:
      habilitada: false
