spring:
  application:
    name: chit-go-back
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/chitgo}
    username: ${DB_USER:chitgo}
    password: ${DB_PASSWORD:chitgo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

chitgo:
  jwt:
    # Clave para firmar el JWT de la sesión, en Base64 (32 bytes o más). Sin valor por defecto a
    # propósito: si falta, el back usa una clave al azar y avisa en el log (ver .env.example).
    clave: ${JWT_CLAVE:}
  sesion:
    # Secure en la cookie de sesión y en la de CSRF. El perfil dev la apaga para entrar por http
    # desde el celular con la IP de la compu.
    cookie-segura: ${COOKIE_SEGURA:true}
