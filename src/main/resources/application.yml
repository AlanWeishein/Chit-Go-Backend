spring:
  application:
    name: chit-go-back
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/chitgo}
    username: ${DB_USER:chitgo}
    password: ${DB_PASSWORD:chitgo}
    # La sesión de MySQL en UTC, como escribe Hibernate los Instant. Si no, con el MySQL en -03 todo lo que
    # guarda JPA queda 3 horas corrido respecto de CURRENT_TIMESTAMP. Va acá y no en la URL para que valga
    # también con otro DB_URL.
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  # Despliegue directo: los headers Forwarded/X-Forwarded-For del cliente no definen su IP.
  forward-headers-strategy: none

chitgo:
  seguridad:
    login-email:
      solicitudes: 3
      ventana: 60s
      maximo-de-claves: 10000
  push:
    habilitado: ${PUSH_HABILITADO:false}
    clave-publica: ${PUSH_CLAVE_PUBLICA:}
    clave-privada: ${PUSH_CLAVE_PRIVADA:}
    contacto: ${PUSH_CONTACTO:}
    hosts-permitidos: ${PUSH_HOSTS_PERMITIDOS:fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com}
  jwt:
    # Clave para firmar el JWT de la sesión, en Base64 (32 bytes o más). Sin valor por defecto a
    # propósito: si falta, el back usa una clave al azar y avisa en el log (ver .env.example).
    clave: ${JWT_CLAVE:}
  sesion:
    # Secure en la cookie de sesión y en la de CSRF. El perfil dev la apaga para entrar por http
    # desde el celular con la IP de la compu.
    cookie-segura: ${COOKIE_SEGURA:true}
  alertas:
    demora:
      # La tarea que manda ALERTA_DEMORA a Caja cada 5 segundos (HU-08). Los tests la apagan en
      # src/test/resources/config/application.yml.
      habilitada: true
  reglas:
    # Los números del negocio (punto 14 del 10/11). Los lee ReglasDelNegocio: si falta alguno, o toda la
    # sección, vale el mismo valor de acá. Un cero, un negativo o una zona que no existe no deja arrancar.
    # El T de inactividad de cada local (RNF-14) no está acá: lo configura el Admin y vive en la base.
    # RF-16: un pedido sin resolverse pasa a demorado después de esto (a los 180 s todavía no, a los 181 sí).
    # En segundos enteros.
    demora-del-pedido: 180s
    # La sesión de Caja se corta a la hora (09/10), sin importar el T del local. El front avisa 5 minutos antes.
    sesion-de-caja: 1h
    # El Gerente/Dueño no tiene local, así que tampoco tiene el T que configura el Admin.
    sesion-sin-local: 10m
    # RF-13: cada cuánto el mozo vuelve a entrar con usuario y contraseña en su celular.
    vigencia-del-dispositivo: 7d
    # RNF-07: intentos fallidos seguidos para quedar bloqueado, hasta que el Admin blanquea el PIN.
    intentos-para-bloquear: 5
    # La del local: los turnos y las ausencias son horas y días de pared, no UTC.
    zona-horaria: America/Argentina/Buenos_Aires
