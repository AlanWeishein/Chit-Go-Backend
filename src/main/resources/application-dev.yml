# Perfil dev: además de las migraciones, carga los datos de prueba de db/dev
# (local, mesas con QR, mozos con sus mesas, turnos y carta).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev

# Cookies sin Secure, para probar por http (por ejemplo desde el celular, con la IP de la compu).
chitgo:
  sesion:
    cookie-segura: false
