# Solo para los tests. Va en config/ y no en la raíz para no tapar el application.yml de main: Spring Boot
# carga los dos y este pisa lo que repite.
spring:
  datasource:
    hikari:
      # La suite conserva contextos diferentes; el pool productivo no cambia.
      maximum-pool-size: 5
      minimum-idle: 1

chitgo:
  auditoria:
    retencion-habilitada: false
  alertas:
    demora:
      # La tarea programada de HU-08 no corre en la suite: los tests llaman a revisarDemorados() a mano.
      # AlertaDeDemoraProgramadaTest la prende para ver que queda agendada.
      habilitada: false
    mesa-sin-mozo:
      # La de HU-14 (CP-07-05), igual: MesaSinMozoTest llama a avisarAlEmpezarLosTurnos() a mano y
      # AlertaDeMesaSinMozoProgramadaTest la prende para ver que queda agendada cada minuto.
      habilitada: false
